<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0f0f0f"/>
  <!-- React atom icon -->
  <!-- Outer ellipses -->
  <g fill="none" stroke="#61DAFB" stroke-width="4">
    <!-- Horizontal ellipse -->
    <ellipse cx="50" cy="50" rx="38" ry="15"/>
    <!-- Rotated 60deg ellipse -->
    <ellipse cx="50" cy="50" rx="38" ry="15" transform="rotate(60 50 50)"/>
    <!-- Rotated 120deg ellipse -->
    <ellipse cx="50" cy="50" rx="38" ry="15" transform="rotate(120 50 50)"/>
  </g>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="5" fill="#61DAFB"/>
</svg>
